paths:
  pdf_dir: data/pdfs
  artifact_dir: artifacts
  graph_db: artifacts/graph.sqlite
  index_dir: artifacts/index
  results_dir: artifacts/results

parse:
  min_chars_per_block: 25
  max_block_chars: 2500
  merge_short_blocks: true

claims:
  use_llm: false
  max_blocks: null
  min_confidence: 0.35

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64

retrieval:
  bm25_k: 80
  dense_k: 80
  seed_k: 80
  final_k: 12
  max_context_chars: 12000
  rrf_k: 60
  graph:
    page_window: 1
    block_window: 2
    section_limit: 12
    claim_limit: 40
    entity_limit: 40
    relation_weights:
      seed: 1.00
      same_page: 0.45
      adjacent_block: 0.55
      same_section: 0.50
      claim_source: 0.75
      same_risk_entity: 0.65
      same_pnl_driver: 0.65
      query_claim_match: 0.85

reranker:
  enabled: false
  base_model: null
  adapter_path: null
  max_length: 1024
  batch_size: 8
  device: cpu
  dtype: float32

cross_encoder:
  enabled: false
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_length: 512
  batch_size: 8
  device: cpu

llm:
  base_url: null
  answer_model: gpt-4o-mini
  judge_model: gpt-4o-mini
  temperature: 0
  timeout_seconds: 90

evaluation:
  dataset_name: PatronusAI/financebench
  split: train
  max_questions: 150
  sample_questions: null
  sample_seed: 42
  doc_scope: strict
