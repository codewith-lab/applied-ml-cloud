apiVersion: batch/v1
kind: Job
metadata:
  name: finrag-ingestion-job
spec:
  template:
    metadata:
      annotations:
        iam.gke.io/gcp-service-account: finrag-gsa@<YOUR_PROJECT_ID>.iam.gserviceaccount.com
    spec:
      serviceAccountName: finrag-ksa
      containers:
      - name: ingest-container
        image: gcr.io/<YOUR_PROJECT_ID>/finrag-ingest:latest
        command: ["python", "src/ingest_pdf.py"]
        env:
        - name: GCS_BUCKET
          value: "finrag-artifacts-bucket"
        - name: NEO4J_URI
          value: "bolt://finrag-neo4j.default.svc.cluster.local:7687"
      restartPolicy: Never