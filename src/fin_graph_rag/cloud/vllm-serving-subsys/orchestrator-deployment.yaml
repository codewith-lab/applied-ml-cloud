apiVersion: apps/v1
kind: Deployment
metadata:
  name: finrag-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: api
        image: gcr.io/<YOUR_PROJECT_ID>/finrag-orchestrator:latest
        ports:
        - containerPort: 8080
        env:
        - name: VLLM_URL
          value: "http://vllm-service.default.svc.cluster.local:8000"
        - name: NEO4J_URI
          value: "bolt://finrag-neo4j.default.svc.cluster.local:7687"
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
spec:
  type: NodePort
  selector:
    app: orchestrator
  ports:
    - port: 80
      targetPort: 8080