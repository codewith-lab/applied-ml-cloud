apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finrag-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/v1beta1.FrontendConfig: "finrag-frontend-config"
spec:
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: orchestrator-service
            port:
              number: 80